name: Oracle Automation CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  approval_gate:
    name: Approval Before Pipeline Execution
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Approved
        run: echo "Pipeline execution approved."

  validate:
    name: Validate Oracle Repo
    runs-on: windows-latest
    needs: approval_gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Critical lint checks
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Validate Oracle repository
        run: |
          python scripts/ci/validate_oracle_repo.py

      - name: Validate access guardrails
        run: |
          python scripts/ci/validate_pipeline_access.py

      - name: Run tests
        run: |
          pytest -q

  deploy:
    name: Deployment Placeholder
    runs-on: windows-latest
    needs: validate
    if: success()

    steps:
      - name: Deployment ready
        run: echo "Validation passed. Deployment can proceed."